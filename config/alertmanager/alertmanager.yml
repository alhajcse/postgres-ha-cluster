global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: [alertname, instance]
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 3h
  routes:
    - match:
        severity: critical
      receiver: critical

receivers:
  - name: default
    # চাইলে email/slack যোগ করুন
    webhook_configs: []

  - name: critical
    webhook_configs: []

