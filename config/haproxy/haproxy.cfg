global
    log         stdout format raw local0
    maxconn     2000
    stats socket /tmp/haproxy.sock mode 660 level admin

defaults
    log         global
    mode        tcp
    option      tcplog
    option      dontlognull
    retries     3
    timeout connect 5s
    timeout client  30m
    timeout server  30m

listen stats
    bind *:7000
    mode http
    stats enable
    stats uri /
    stats refresh 5s
    stats show-legends
    stats admin if TRUE

frontend pg_write
    bind *:5000
    default_backend pg_primary

frontend pg_read
    bind *:5001
    default_backend pg_replicas

frontend pg_all
    bind *:5002
    default_backend pg_all_nodes

backend pg_primary
    balance first
    server primary 10.70.16.231:5432 check inter 1s fall 2 rise 1

backend pg_replicas
    balance roundrobin
    server replica1 10.70.16.232:5432 check inter 1s fall 2 rise 1
    server replica2 10.70.16.233:5432 check inter 1s fall 2 rise 1

backend pg_all_nodes
    balance roundrobin
    server primary 10.70.16.231:5432 check inter 1s fall 2 rise 1
    server replica1 10.70.16.232:5432 check inter 1s fall 2 rise 1
    server replica2 10.70.16.233:5432 check inter 1s fall 2 rise 1

# ═══════════════════════════════════════════════════════════
# Kubernetes API Server Load Balancer
# Added: 2026-10-13
# ═══════════════════════════════════════════════════════════

frontend k8s_api_frontend
    bind *:6443
    mode tcp
    option tcplog
    default_backend k8s_api_backend

backend k8s_api_backend
    mode tcp
    balance roundrobin
    option httpchk GET /healthz
    http-check expect status 200
    default-server inter 3s fall 3 rise 2
    server cp1 10.70.16.237:6443 check check-ssl verify none
    server cp2 10.70.16.238:6443 check check-ssl verify none
    server cp3 10.70.16.239:6443 check check-ssl verify none

# ==========================================================
# Kubernetes Applications - Traefik HTTP Ingress
# HAProxy :80 -> Traefik NodePort :30080
# ==========================================================

frontend k8s_apps_http_frontend
    bind *:80
    mode http
    option httplog
    default_backend traefik_http_backend

backend traefik_http_backend
    mode http
    balance roundrobin
    option httpchk
    http-check send meth GET uri /ping ver HTTP/1.1 hdr Host whoami.lab.local
    http-check expect status 200
    server worker1 10.70.16.240:30080 check
    server worker2 10.70.16.241:30080 check
