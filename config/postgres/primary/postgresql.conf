# ==== Replication ====
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
wal_keep_size = 1GB
wal_sender_timeout = 60s
wal_compression = on

# ==== Connections ====
listen_addresses = '*'
max_connections = 200

# ==== Standby ====
hot_standby = on
hot_standby_feedback = on

# ==== Logging ====
log_replication_commands = on
logging_collector = off