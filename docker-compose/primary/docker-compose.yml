services:
  postgres-primary:
    image: ${POSTGRES_IMAGE}
    container_name: ${PRIMARY_CONTAINER_NAME}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - primary-data:/var/lib/postgresql/data
      - ../../config/postgres/primary/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ../../config/postgres/primary/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ../../scripts/primary/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: >
      postgres
      -c config_file=/etc/postgresql/postgresql.conf
      -c hba_file=/etc/postgresql/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres-exporter:
    image: ${PG_EXPORTER_IMAGE}
    container_name: postgres-exporter
    restart: unless-stopped
    ports:
      - "${PG_EXPORTER_PORT}:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-primary:5432/postgres?sslmode=disable"
      PG_EXPORTER_WEB_LISTEN_ADDRESS: ":9187"
    depends_on:
      postgres-primary:
        condition: service_healthy

  node-exporter:
    image: ${NODE_EXPORTER_IMAGE}
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "${NODE_EXPORTER_PORT}:9100"
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)

volumes:
  primary-data:

networks:
  default:
    name: pg-primary-net