version: '3.8'

services:
  postgres-primary:
    image: postgres:15
    container_name: postgres-primary
    env_file:
      - ../../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - primary-data:/var/lib/postgresql/data
      - ../../config/postgres/primary/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ../../config/postgres/primary/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ../../scripts/primary/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - pg-net
    command: >
      postgres
      -c config_file=/etc/postgresql/postgresql.conf
      -c hba_file=/etc/postgresql/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  primary-data:

networks:
  pg-net:
    driver: bridge