services:
  postgres-replica2:
    image: ${POSTGRES_IMAGE}
    container_name: ${REPLICA2_CONTAINER_NAME}
    environment:
      PRIMARY_IP: ${PROD_PRIMARY_HOST}
      PRIMARY_PORT: 5432
      REPLICATION_SLOT: ${REPLICATION_SLOT_2}
      REPLICATOR_USER: ${REPLICATOR_USER}
      REPLICATOR_PASSWORD: ${REPLICATOR_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - replica2-data:/var/lib/postgresql/data
      - ../../config/postgres/replica/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ../../scripts/replica/entrypoint.sh:/entrypoint-replica.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint-replica.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres-exporter:
    image: ${PG_EXPORTER_IMAGE}
    container_name: postgres-exporter
    restart: unless-stopped
    ports:
      - "${PG_EXPORTER_PORT}:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-replica2:5432/postgres?sslmode=disable"
    depends_on:
      - postgres-replica2

  node-exporter:
    image: ${NODE_EXPORTER_IMAGE}
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "${NODE_EXPORTER_PORT}:9100"
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)

volumes:
  replica2-data:

networks:
  default:
    name: pg-replica2-net