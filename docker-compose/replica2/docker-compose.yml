version: '3.8'

services:
  postgres-replica2:
    image: postgres:15
    container_name: postgres-replica2
    env_file:
      - ../../.env
    environment:
      PRIMARY_IP: ${PRIMARY_IP}
      REPLICATION_SLOT: ${REPLICATION_SLOT_2}
      REPLICATOR_USER: ${REPLICATOR_USER}
      REPLICATOR_PASSWORD: ${REPLICATOR_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - replica2-data:/var/lib/postgresql/data
      - ../../config/postgres/replica/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ../../scripts/replica/entrypoint.sh:/entrypoint-replica.sh:ro
    networks:
      - pg-net
    entrypoint: ["/bin/bash", "/entrypoint-replica.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  replica2-data:

networks:
  pg-net:
    driver: bridge